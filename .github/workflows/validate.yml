name: Pronóstico bursátil — ejecutar y publicar resultados
on:
  workflow_dispatch:
  push:
    paths:
      - 'notebooks/stock_forecasting.ipynb'
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/validate.yml'
permissions:
  contents: write
concurrency:
  group: stock-lab-main
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install 'torch>=2.3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt nbconvert nbformat ipykernel
      - name: Validar el notebook original
        run: |
          python - <<'PY'
          import nbformat
          p='notebooks/stock_forecasting.ipynb'
          nb=nbformat.read(p,as_version=4)
          nbformat.validate(nb)
          assert len(nb.cells)>=15
          for index,cell in enumerate(nb.cells):
            if cell.cell_type == 'code':
              compile(cell.source, f'{p}:cell{index}', 'exec')
          print(f'Cuaderno validado: {p}, con {len(nb.cells)} celdas')
          PY
      - name: Ejecutar el laboratorio completo
        run: |
          jupyter nbconvert --to notebook --execute notebooks/stock_forecasting.ipynb --output stock_forecasting_executed.ipynb --output-dir . --ExecutePreprocessor.timeout=3600
      - name: Preparar galería de resultados con gráficas reales
        run: |
          python scripts/exportar_graficas.py
      - name: Comprobar los archivos generados
        if: success()
        run: |
          find . -maxdepth 3 -type f \( -name '*.pt' -o -name '*.csv' -o -name 'executive_summary.md' -o -name 'environment.txt' \) -print
          test -s stock_forecasting_executed.ipynb
          test -s notebooks/reports/figuras/00_comparacion_rmse.png
          test -s notebooks/reports/figuras/06_cierre_real_y_estimado.png
          python - <<'PY'
          import json, glob
          p='stock_forecasting_executed.ipynb'
          nb=json.load(open(p))
          code=[c for c in nb['cells'] if c['cell_type']=='code']
          assert all(c.get('execution_count') is not None for c in code), 'Hay celdas de código sin ejecutar'
          assert all(not any(o.get('output_type')=='error' for o in c.get('outputs',[])) for c in code)
          assert len(glob.glob('**/checkpoints/*.pt', recursive=True)) >= 6, 'Faltan archivos con pesos de los modelos'
          assert len(glob.glob('**/reports/model_metrics.csv',recursive=True)) >= 1, 'Falta la tabla de métricas de los modelos'
          assert len(glob.glob('**/reports/executive_summary.md',recursive=True)) >= 1, 'Falta el resumen ejecutivo'
          print('Validación completa superada. Celdas de código:',len(code))
          PY
      - name: Conservar cuaderno ejecutado y modelos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-lab-complete
          retention-days: 90
          path: |
            stock_forecasting_executed.ipynb
            data/
            checkpoints/
            reports/
            notebooks/data/
            notebooks/checkpoints/
            notebooks/reports/
          if-no-files-found: warn
      - name: Publicar los resultados validados en el repositorio
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f stock_forecasting_executed.ipynb
          for p in data checkpoints reports notebooks/data notebooks/checkpoints notebooks/reports; do
            if [ -e "$p" ]; then git add -f "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "resultados: guardar cuaderno, datos, métricas y pesos comprobados [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
